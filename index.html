const state = {
  score: 0, level: 1, progress: 0,
  progressMax: CONFIG.progression.levelProgressStart,
  totalCaptured: 0, combo: 0, comboTimer: 0,
  missedSats: 0, missedTotal: 0,
  gameOver: false, started: false, time: 0,
  spawnTimer: 0, spawnInterval: CONFIG.spawn.initialInterval,
  inactiveSpawnTimer: 0, demo: true, finalResult: null,
  lastTickAt: 0, lastCriticalAt: 0,
};

function reset() {
  satellites = [];
  state.score = 0; state.level = 1; state.progress = 0;
  state.progressMax = CONFIG.progression.levelProgressStart;
  state.totalCaptured = 0; state.combo = 0; state.comboTimer = 0;
  state.missedSats = 0; state.missedTotal = 0;
  state.gameOver = false; state.started = true;
  state.time = 0; state.spawnTimer = 0;
  state.spawnInterval = CONFIG.spawn.initialInterval;
  state.inactiveSpawnTimer = 0;
  state.demo = false; state.finalResult = null;
  state.lastTickAt = 0; state.lastCriticalAt = 0;
  antenna.energy = CONFIG.energy.max;
  antenna.angle = -Math.PI / 2;
  antenna.targetAngle = -Math.PI / 2;
  autoTrack.unlocked = (state.level >= CONFIG.autoTrack.unlockLevel);
  autoTrack.charges = autoTrack.unlocked ? CONFIG.autoTrack.chargesPerLevel : 0;
  autoTrack.active = false;
  autoTrack.timeLeft = 0;
  autoTrack.flash = 0;
  autoTrack.target = null;
  autoTrack.retargetTimer = 0;
  initStars(); initGroundDetails(); initMoon();
}

function demoRestart() {
  satellites = [];
  state.score = 0; state.level = 1; state.progress = 0;
  state.progressMax = CONFIG.progression.levelProgressStart;
  state.totalCaptured = 0; state.combo = 0; state.comboTimer = 0;
  state.missedSats = 0; state.missedTotal = 0;
  state.spawnTimer = 0;
  state.spawnInterval = CONFIG.spawn.initialInterval;
  state.inactiveSpawnTimer = 0;
  antenna.energy = CONFIG.energy.max;
  antenna.angle = -Math.PI / 2;
  antenna.targetAngle = -Math.PI / 2;
  autoTrack.unlocked = (state.level >= CONFIG.autoTrack.unlockLevel);
  autoTrack.charges = autoTrack.unlocked ? CONFIG.autoTrack.chargesPerLevel : 0;
  autoTrack.active = false;
  autoTrack.timeLeft = 0;
  autoTrack.flash = 0;
  autoTrack.target = null;
  autoTrack.retargetTimer = 0;
  satellites.push(spawnSatellite('normal'));
}

function startGame() {
  if (state.gameOver) reset();
  else if (!state.started) reset();
}

function endGame() {
  if (state.gameOver) return;
  state.gameOver = true;
  state.demo = true;
  state.finalResult = {
    score: state.score, level: state.level,
    missedSats: state.missedSats, missedTotal: state.missedTotal,
    totalCaptured: state.totalCaptured,
  };
  autoTrack.active = false;
  autoTrack.timeLeft = 0;
  autoTrack.target = null;
}

let lastTime = performance.now();

function update(dt) {
  state.time += dt;
  updateStars(dt);
  updateMoon(dt);
  updateMeteors(dt);
  if (!state.demo) {
    const energyRatio = antenna.energy / CONFIG.energy.max;
    if (energyRatio < CONFIG.energy.criticalThreshold) {
      const nowMs = performance.now();
      if (nowMs - state.lastCriticalAt >= CONFIG.audio.critical.intervalMs) {
        sfx('critical');
        state.lastCriticalAt = nowMs;
      }
    }
  }
  state.demo = !state.started || state.gameOver;
  if (state.demo) {
    autoTrack.active = true;
    autoTrack.timeLeft = CONFIG.autoTrack.durationSec;
  } else {
    if (autoTrack.active) {
      autoTrack.timeLeft -= dt / 1000;
      if (autoTrack.timeLeft <= 0) {
        autoTrack.active = false;
        autoTrack.timeLeft = 0;
        autoTrack.target = null;
      }
    }
  }
  if (autoTrack.flash > 0) autoTrack.flash -= dt / 1000;
  state.spawnTimer += dt;
  if (state.spawnTimer >= state.spawnInterval) {
    state.spawnTimer = 0;
    const activeCount = satellites.filter(s => !s.inactive).length;
    if (activeCount < CONFIG.satellite.maxOnScreen) satellites.push(spawnSatellite());
    state.spawnInterval = Math.max(
      CONFIG.spawn.minInterval,
      CONFIG.spawn.initialInterval - state.level * CONFIG.spawn.intervalDecreasePerLevel
    );
  }
  state.inactiveSpawnTimer += dt;
  if (state.inactiveSpawnTimer >= CONFIG.inactive.spawnInterval) {
    state.inactiveSpawnTimer = 0;
    const inactiveCount = satellites.filter(s => s.inactive).length;
    if (inactiveCount < CONFIG.inactive.maxOnScreen) satellites.push(spawnSatellite(null, true));
  }
  updateAntenna(dt, pointer);
  updateSatellites(dt);
  const ds = dt / 1000;
  const energyRatio = antenna.energy / CONFIG.energy.max;
  const rateMul = rateMulFromEnergy(energyRatio);
  for (const s of satellites) {
    if (s.inactive) { s.downloading = false; continue; }
    if (s.completed) { s.downloading = false; continue; }
    if (!isSatelliteVisible(s)) { s.downloading = false; continue; }
    const p = satPos(s);
    if (inCaptureZone(p.x, p.y)) {
      if (!s.downloading) sfx('capture');
      s.downloading = true;
      s.dataLeft = Math.max(0, s.dataLeft - s.cfg.dataRate * rateMul * ds);
      const nowMs = performance.now();
      if (nowMs - state.lastTickAt >= CONFIG.audio.downloadTick.intervalMs) {
        sfx('downloadTick');
        state.lastTickAt = nowMs;
      }
      if (s.dataLeft <= 0) completeDownload(s);
    } else {
      s.downloading = false;
    }
  }
  for (const s of satellites) {
    if (s.inactive) continue;
    if (s.t > 1.02 && !s.completed && !s.missedCounted) {
      s.missedCounted = true;
      state.missedSats++;
      state.missedTotal++;
      sfx('miss');
      const limit = CONFIG.progression.missedLimit;
      if (limit > 0 && state.missedSats >= limit) {
        if (state.demo) { demoRestart(); return; }
        else { endGame(); return; }
      }
    }
  }
  if (state.combo > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 0;
  }
}

function completeDownload(s) {
  sfx('complete');
  s.completed = true;
  s.downloading = false;
  s.justCompletedFlash = 1;
  if (!s.awarded) {
    s.awarded = true;
    state.combo++;
    state.comboTimer = CONFIG.progression.comboWindowMs;
    const comboBonus = Math.floor(state.combo / CONFIG.progression.comboBonusEvery) * CONFIG.progression.comboBonusPoints;
    const gain = s.cfg.score + comboBonus;
    state.score += gain;
    state.totalCaptured++;
    state.progress += 20 + s.cfg.score;
    if (state.progress >= state.progressMax) {
      state.progress = 0;
      state.level++;
      sfx('levelUp');
      state.progressMax = CONFIG.progression.levelProgressStart + state.level * CONFIG.progression.levelProgressAdd;
      if (CONFIG.progression.resetMissedOnLevelUp) state.missedSats = 0;
      const acfg = CONFIG.autoTrack;
      if (state.level >= acfg.unlockLevel) {
        if (!autoTrack.unlocked) {
          autoTrack.unlocked = true;
          autoTrack.flash = 1.5;
        }
        autoTrack.charges = Math.min(acfg.maxCharges, autoTrack.charges + acfg.chargesPerLevel);
      }
    }
  }
}

// ============================================================
// HUD
// ============================================================
function drawMissedIndicator() {
  const limit = CONFIG.progression.missedLimit;
  if (limit <= 0) return;
  const s = WORLD_SCALE;
  const x0 = 10 * s;
  const y0 = 45 * s;
  const step = 22 * s;
  for (let i = 0; i < limit; i++) {
    const cx = x0 + 12 * s + i * step;
    const cy = y0 + 12 * s;
    const missed = i < state.missedSats;
    if (missed) {
      drawSatelliteIcon(cx, cy, 0.55, 0, { color: '#5a6a7a' }, { dim: true, crossOut: true });
    } else {
      drawSatelliteIcon(cx, cy, 0.55, 0, { color: '#ff5f7a' }, { outline: true });
    }
  }
}

function autoTrackButtonCenter() {
  const cfg = CONFIG.autoTrack;
  const s = WORLD_SCALE;
  return {
    x: W - (cfg.buttonMargin + cfg.buttonRadius) * s,
    y: H - (cfg.buttonMargin + cfg.buttonRadius) * s,
    r: cfg.buttonRadius * s,
  };
}

function hitAutoTrackButton(mx, my) {
  if (!autoTrack.unlocked) return false;
  const b = autoTrackButtonCenter();
  const dx = mx - b.x;
  const dy = my - b.y;
  return dx * dx + dy * dy <= b.r * b.r;
}

function drawAutoTrackButton() {
  const cfg = CONFIG.autoTrack;
  const b = autoTrackButtonCenter();
  const x = b.x, y = b.y, r = b.r;
  const s = WORLD_SCALE;
  let color = cfg.lockedColor;
  if (autoTrack.unlocked) color = autoTrack.active ? cfg.activeColor : cfg.idleColor;
  const canUse = autoTrack.unlocked && (autoTrack.charges > 0 || autoTrack.active);
  const alpha = canUse ? 1 : 0.45;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (autoTrack.active) {
    const glow = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 1.7);
    glow.addColorStop(0, cfg.activeColor + '88');
    glow.addColorStop(1, cfg.activeColor + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(10,20,40,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = `bold ${Math.round(18 * s)}px -apple-system, Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('АС', x, y - 1);
  if (autoTrack.active) {
    const frac = clamp(autoTrack.timeLeft / cfg.durationSec, 0, 1);
    ctx.strokeStyle = cfg.activeColor;
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.arc(x, y, r + 4 * s, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
  }
  if (autoTrack.unlocked) {
    const maxC = cfg.maxCharges;
    const dotR = 2.5 * s;
    const gap = 8 * s;
    const totalW = (maxC - 1) * gap;
    const startX = x - totalW / 2;
    const dotY = y + r + 8 * s;
    for (let i = 0; i < maxC; i++) {
      const filled = i < autoTrack.charges;
      ctx.beginPath();
      ctx.arc(startX + i * gap, dotY, dotR, 0, Math.PI * 2);
      if (filled) {
        ctx.fillStyle = cfg.idleColor;
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(120,180,255,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
  ctx.restore();
  if (autoTrack.flash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, autoTrack.flash);
    ctx.strokeStyle = cfg.activeColor;
    ctx.lineWidth = 3 * s;
    const rr = r + 8 * s + (1.5 - autoTrack.flash) * 20 * s;
    ctx.beginPath();
    ctx.arc(x, y, rr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function soundButtonCenter() {
  const s = WORLD_SCALE;
  return { x: W - 26 * s, y: 100 * s, r: 14 * s };
}

function hitSoundButton(mx, my) {
  const b = soundButtonCenter();
  const dx = mx - b.x;
  const dy = my - b.y;
  return dx * dx + dy * dy <= b.r * b.r;
}

function drawSoundButton() {
  const b = soundButtonCenter();
  const x = b.x, y = b.y-25, r = b.r;
  const s = WORLD_SCALE;
  ctx.save();
  ctx.fillStyle = 'rgba(10,20,40,0.75)';
  ctx.beginPath();
  ctx.arc(x+1, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = soundMuted ? 'rgba(120,130,150,0.8)' : 'rgba(95,184,255,0.8)';
  ctx.lineWidth = 1.5 * s;
  ctx.beginPath();
  ctx.arc(x+1, y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = soundMuted ? '#7a869a' : '#5fb8ff';
  ctx.strokeStyle = soundMuted ? '#7a869a' : '#5fb8ff';
  ctx.beginPath();
  ctx.moveTo(x - 5 * s, y - 3 * s);
  ctx.lineTo(x - 2 * s, y - 3 * s);
  ctx.lineTo(x + 2 * s, y - 6 * s);
  ctx.lineTo(x + 2 * s, y + 6 * s);
  ctx.lineTo(x - 2 * s, y + 3 * s);
  ctx.lineTo(x - 5 * s, y + 3 * s);
  ctx.closePath();
  ctx.fill();
  if (soundMuted) {
    ctx.lineWidth = 1.8 * s;
    ctx.beginPath();
    ctx.moveTo(x + 4 * s, y - 3 * s);
    ctx.lineTo(x + 8 * s, y + 3 * s);
    ctx.moveTo(x + 8 * s, y - 3 * s);
    ctx.lineTo(x + 4 * s, y + 3 * s);
    ctx.stroke();
  } else {
    ctx.lineWidth = 1.2 * s;
    ctx.beginPath();
    ctx.arc(x + 2 * s, y, 3 * s, -Math.PI * 0.35, Math.PI * 0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + 2 * s, y, 5 * s, -Math.PI * 0.3, Math.PI * 0.3);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  const s = WORLD_SCALE;
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#e8f0ff';
  ctx.font = `bold ${Math.round(28 * s)}px -apple-system, Arial`;
  ctx.textAlign = 'left';
  ctx.fillText(state.score, 10 * s, s);
  ctx.font = `bold ${Math.round(12 * s)}px -apple-system, Arial`;
  ctx.fillStyle = 'rgba(160,200,255,0.7)';
  ctx.fillText('ОЧКИ', 10 * s, 30 * s);
  drawMissedIndicator();
  ctx.textAlign = 'right';
  ctx.fillStyle = '#e8f0ff';
  ctx.font = `bold ${Math.round(20 * s)}px -apple-system, Arial`;
  ctx.fillText('УР. ' + state.level, W - 10 * s, 2 * s);
  ctx.font = `bold ${Math.round(12 * s)}px -apple-system, Arial`;
  ctx.fillStyle = 'rgba(160,200,255,0.7)';
  ctx.fillText('Сеансы связи: ' + state.totalCaptured, W - 10 * s, 30 * s);
  if (!state.demo) drawSoundButton();
  const barW = 160 * s, barH = 6 * s;
  const barX = W / 2 - barW / 2, barY = 12 * s;
  ctx.fillStyle = 'rgba(80,140,220,0.2)';
  ctx.fillRect(barX, barY, barW, barH);
  const prog = clamp(state.progress / state.progressMax, 0, 1);
  const pg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  pg.addColorStop(0, '#5fb8ff'); pg.addColorStop(1, '#5effa0');
  ctx.fillStyle = pg;
  ctx.fillRect(barX, barY, barW * prog, barH);
  ctx.strokeStyle = 'rgba(120,180,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);
  const eBarW = 120 * s, eBarH = 8 * s;
  const eBarX = 16 * s, eBarY = H - 30 * s;
  ctx.fillStyle = 'rgba(80,140,220,0.2)';
  ctx.fillRect(eBarX, eBarY, eBarW, eBarH);
  const ep = antenna.energy / CONFIG.energy.max;
  const eg = ctx.createLinearGradient(eBarX, 0, eBarX + eBarW, 0);
  eg.addColorStop(0, ep > CONFIG.energy.criticalThreshold ? '#5effa0' : '#ff5f7a');
  eg.addColorStop(1, ep > CONFIG.energy.criticalThreshold ? '#5fb8ff' : '#ff9f5f');
  ctx.fillStyle = eg;
  ctx.fillRect(eBarX, eBarY, eBarW * ep, eBarH);
  ctx.strokeStyle = 'rgba(120,180,255,0.5)';
  ctx.strokeRect(eBarX, eBarY, eBarW, eBarH);
  ctx.fillStyle = 'rgba(160,200,255,0.7)';
  ctx.font = `bold ${Math.round(10 * s)}px -apple-system, Arial`;
  ctx.textAlign = 'left';
  ctx.fillText('ЭНЕРГИЯ', eBarX, eBarY - 14 * s);
  if (state.combo >= 2) {
    ctx.fillStyle = 'rgba(255,220,120,' + (0.6 + Math.sin(state.time * 0.01) * 0.3) + ')';
    ctx.font = `bold ${Math.round(16 * s)}px -apple-system, Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('КОМБО ×' + state.combo, W / 2, H - 60 * s);
  }
  if (!state.demo) drawAutoTrackButton();
  if (!state.started && !state.gameOver) {
    ctx.fillStyle = 'rgba(5,8,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e8f0ff';
    ctx.font = `bold ${Math.round(30 * s)}px -apple-system, Arial`;
    ctx.fillText('UPLink', W / 2, H / 2 - 80 * s);
    ctx.font = `${Math.round(16 * s)}px -apple-system, Arial`;
    ctx.fillStyle = 'rgba(200,230,255,0.95)';
    ctx.fillText('Наведи луч антенны на спутник', W / 2, H / 2 - 20 * s);
    ctx.fillText('и дождись полной загрузки данных', W / 2, H / 2 + 8 * s);
    ctx.font = `bold ${Math.round(18 * s)}px -apple-system, Arial`;
    ctx.fillStyle = '#5fb8ff';
    ctx.fillText('Коснись, чтобы начать', W / 2, H / 2 + 100 * s);
  }
  if (state.gameOver) {
    ctx.fillStyle = 'rgba(5,8,20,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff5f7a';
    ctx.font = `bold ${Math.round(30 * s)}px -apple-system, Arial`;
    ctx.fillText('СИГНАЛ ПОТЕРЯН', W / 2, H / 2 - 100 * s);
    const fr = state.finalResult || {
      score: state.score, level: state.level,
      missedSats: state.missedSats, missedTotal: state.missedTotal,
      totalCaptured: state.totalCaptured,
    };
    ctx.font = `${Math.round(16 * s)}px -apple-system, Arial`;
    ctx.fillStyle = 'rgba(200,230,255,0.95)';
    ctx.fillText('Очки: ' + fr.score, W / 2, H / 2 - 50 * s);
    ctx.fillText('Уровень: ' + fr.level, W / 2, H / 2 - 22 * s);
    ctx.fillText('Сеансов связи: ' + fr.totalCaptured, W / 2, H / 2 + 6 * s);
    ctx.fillText('Потеряно: ' + fr.missedTotal, W / 2, H / 2 + 34 * s);
    ctx.font = `bold ${Math.round(18 * s)}px -apple-system, Arial`;
    ctx.fillStyle = '#5fb8ff';
    ctx.fillText('Коснись, чтобы начать заново', W / 2, H / 2 + 100 * s);
  }
}

// ============================================================
// РЕНДЕР
// ============================================================
function render() {
  const bg = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  bg.addColorStop(0, '#05060f');
  bg.addColorStop(0.7, '#0a1330');
  bg.addColorStop(1, '#132444');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const a = s.baseAlpha * (0.6 + Math.sin(s.phase) * 0.4);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * WORLD_SCALE, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawMoon();
  drawMeteors();
  drawArcGuides();
  drawGround(state.time);
  for (const s of satellites) drawUplink(s);
  drawBeam();
  for (const s of satellites) drawSatellite(s);
  drawAntenna();
  drawHUD();
}

// ============================================================
// ЦИКЛ
// ============================================================
const STEP = 1000 / 60;
let acc = 0;

function loop(t) {
  const delta = Math.min(t - lastTime, 100);
  lastTime = t;
  acc += delta;
  while (acc >= STEP) {
    update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}

// ============================================================
// УПРАВЛЕНИЕ
// ============================================================
let pointer = null;

function updatePointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pointer = {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
  pointerManualUntil = performance.now() + CONFIG.autoTrack.manualOverrideMs;
}

canvas.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));

canvas.addEventListener('mousedown', (e) => {
  unlockAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  if (!state.demo && hitSoundButton(mx, my+25)) { soundMuted = !soundMuted; return; }
  if (!state.demo && hitAutoTrackButton(mx, my)) { toggleAutoTrack(); return; }
  updatePointer(e.clientX, e.clientY);
  startGame();
});

canvas.addEventListener('touchstart', (e) => {
  unlockAudio();
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const mx = (t.clientX - rect.left) * (W / rect.width);
  const my = (t.clientY - rect.top) * (H / rect.height);
  if (!state.demo && hitSoundButton(mx, my+25)) { soundMuted = !soundMuted; return; }
  if (!state.demo && hitAutoTrackButton(mx, my)) { toggleAutoTrack(); return; }
  updatePointer(t.clientX, t.clientY);
  startGame();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  updatePointer(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('keydown', (e) => {
  unlockAudio();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') startGame();
  if (!pointer) pointer = { x: ANTENNA_X, y: ANTENNA_BASE.y - 200 };
  if (e.key === 'ArrowLeft') {
    antenna.targetAngle = clamp(antenna.targetAngle - 0.05, CONFIG.antenna.minAngle, CONFIG.antenna.maxAngle);
    pointerManualUntil = performance.now() + CONFIG.autoTrack.manualOverrideMs;
  }
  if (e.key === 'ArrowRight') {
    antenna.targetAngle = clamp(antenna.targetAngle + 0.05, CONFIG.antenna.minAngle, CONFIG.antenna.maxAngle);
    pointerManualUntil = performance.now() + CONFIG.autoTrack.manualOverrideMs;
  }
  if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') {
    if (!state.demo) toggleAutoTrack();
  }
  if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') soundMuted = !soundMuted;
  e.preventDefault();
});

// ============================================================
// СТАРТ
// ============================================================
state.demo = true;
state.started = false;

resize();
initStars();
initMoon();
satellites.push(spawnSatellite('normal'));
nextMeteorAt = performance.now() + rand(1000, 3000);
requestAnimationFrame(loop);

})();
</script>
</body>
